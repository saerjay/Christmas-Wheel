<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crafty Christmas Secret Santa Wheel</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;600;700&family=Shrikhand&display=swap" rel="stylesheet">
    <style>
        :root {
            --craft-bg: #2d5a3f;
            --pink-felt: #ff6b8b;
            --cream-felt: #fff8e7;
            --gold-glitter: #ffd700;
            --red-stitch: #d63031;
            --kraft-paper: #e6c594;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--craft-bg);
            background-image: 
                radial-gradient(#ffffff22 2px, transparent 2px),
                radial-gradient(#ffffff11 2px, transparent 2px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            font-family: 'Fredoka', cursive, sans-serif;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .header-banner {
            background: #d63031;
            background-image: repeating-linear-gradient(45deg, #c0392b 0, #c0392b 15px, #d63031 15px, #d63031 30px);
            padding: 15px 25px;
            border-radius: 20px;
            border: 4px dashed #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3), 0 0 0 8px #d63031;
            text-align: center;
            max-width: 900px;
            width: 100%;
            margin: 15px 0 25px 0;
            transform: rotate(-1deg);
            position: relative;
        }

        .header-title {
            font-family: 'Shrikhand', cursive;
            color: var(--cream-felt);
            font-size: clamp(1.4rem, 4vw, 2.3rem);
            text-shadow: 3px 3px 0px #2d3436;
            line-height: 1.25;
            letter-spacing: 0.5px;
        }

        .festive-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: #27ae60;
            color: white;
            border: 3px dashed white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .festive-toggle-btn.off {
            background: #7f8c8d;
        }

        .festive-toggle-btn:active {
            transform: scale(0.95);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            gap: 20px;
        }

        .user-selector-card {
            background: var(--cream-felt);
            border: 4px solid #fab1a0;
            border-radius: 20px;
            padding: 15px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 6px 0px #e17055;
        }

        .user-selector-card label {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d63031;
            display: block;
            margin-bottom: 8px;
        }

        .user-select {
            width: 100%;
            padding: 10px 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            border: 3px solid #fdcb6e;
            border-radius: 12px;
            background: white;
            color: #2d3436;
            outline: none;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }

        .wheel-outer-wrapper {
            position: relative;
            width: min(90vw, 420px);
            height: min(90vw, 420px);
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #f1c40f;
            border: 10px dashed #e67e22;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 15px rgba(0,0,0,0.2);
            padding: 10px;
            position: relative;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .pointer-scissors {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 3rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
            transform-origin: center bottom;
        }

        .pointer-scissors.tick {
            animation: tickAnim 0.1s ease-in-out;
        }

        @keyframes tickAnim {
            0% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-15deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        .spin-btn {
            background: #e84393;
            color: white;
            font-family: 'Shrikhand', cursive;
            font-size: 1.8rem;
            padding: 15px 40px;
            border: 4px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0px #b2bec3, 0 12px 20px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .spin-btn:hover {
            transform: translateY(-2deg);
            box-shadow: 0 10px 0px #b2bec3, 0 14px 22px rgba(0,0,0,0.3);
        }

        .spin-btn:active {
            transform: translateY(4deg);
            box-shadow: 0 4px 0px #b2bec3, 0 6px 10px rgba(0,0,0,0.3);
        }

        .spin-btn:disabled {
            background: #b2bec3 !important;
            box-shadow: 0 4px 0px #636e72 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .polaroid-modal {
            background: #ffffff;
            padding: 20px 20px 30px 20px;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 12px #ffffff;
            width: 100%;
            max-width: 420px;
            text-align: center;
            transform: scale(0.8) rotate(-3deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .polaroid-modal {
            transform: scale(1) rotate(-1deg);
        }

        .modal-title {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: #d63031;
            margin-bottom: 5px;
        }

        .target-name {
            font-family: 'Shrikhand', cursive;
            font-size: 2.8rem;
            color: #00b894;
            margin: 15px 0;
            text-shadow: 2px 2px 0px #fdcb6e;
            word-break: break-word;
        }

        .modal-close-btn {
            background: #00b894;
            color: white;
            border: 3px solid white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 0px #00a884;
        }

        .wishlist-card {
            background: var(--kraft-paper);
            border: 4px dashed #b2bec3;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .wishlist-card h2 {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: #d63031;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #fdcb6e;
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        .share-btn {
            width: 100%;
            background: #6c5ce7;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 0px #5f27cd;
        }

        .share-btn:active {
            transform: translateY(2deg);
            box-shadow: 0 2px 0px #5f27cd;
        }
    </style>
</head>
<body>

    <button id="festiveToggle" class="festive-toggle-btn off">
        <span>🎄</span> <span id="festiveStatusText">Are You Festive?: No</span>
    </button>

    <header class="header-banner">
        <h1 class="header-title">Who Wants to Make Some Crafty Christmas Anti-Commercialism Magic Happen This Year?</h1>
    </header>

    <div class="main-container">
        <div class="user-selector-card">
            <label for="userSelect">✂️ Step 1: Who is spinning?</label>
            <select id="userSelect" class="user-select">
                <option value="" disabled selected>-- Select Your Name --</option>
                <option value="Mom">Mom</option>
                <option value="Dad">Dad</option>
                <option value="Brice">Brice</option>
                <option value="Meghan">Meghan</option>
                <option value="Christina">Christina</option>
                <option value="Dane">Dane</option>
                <option value="Sarah">Sarah</option>
                <option value="Mostafa">Mostafa</option>
            </select>
        </div>

        <div class="wheel-outer-wrapper">
            <div class="pointer-scissors" id="scissorsPointer">✂️</div>
            <div class="wheel-frame">
                <canvas id="wheelCanvas" width="800" height="800"></canvas>
            </div>
        </div>

        <button id="spinBtn" class="spin-btn" disabled>SPIN THE WHEEL!</button>

        <div class="wishlist-card">
            <h2>🎨 Secret Santa Inspiration Notes</h2>
            <p style="font-size:0.9rem; margin-bottom:12px; text-align:center;">Fill this out and click below to copy a text note for the family group chat!</p>
            
            <div class="form-group">
                <label for="favColors">Favorite Colors / Aesthetics:</label>
                <input type="text" id="favColors" placeholder="e.g. Earthy greens, pastel pinks, vintage warm">
            </div>

            <div class="form-group">
                <label for="craftMaterials">Loved Materials / Preferred Items:</label>
                <input type="text" id="craftMaterials" placeholder="e.g. Wood, wool yarn, pottery, handmade candles">
            </div>

            <div class="form-group">
                <label for="inspiration">Craft Inspiration / Ideas for your Santa:</label>
                <textarea id="inspiration" rows="2" placeholder="e.g. I love handmade knitted beanies, painted mugs, or custom embroidery!"></textarea>
            </div>

            <button id="shareBtn" class="share-btn">📋 Copy Inspiration for Family Chat</button>
        </div>
    </div>

    <!-- Modal Reveal -->
    <div id="resultModal" class="modal-overlay">
        <div class="polaroid-modal">
            <div class="modal-title">You are crafting for...</div>
            <div id="targetNameDisplay" class="target-name">???</div>
            <p style="font-size:0.95rem; color:#636e72;">Remember: 100% Handmade & Crafted with Love! 🧶🎨</p>
            <button id="closeModalBtn" class="modal-close-btn">Keep It Secret! 🤫</button>
        </div>
    </div>

    <script>
        const ALL_NAMES = ["Mom", "Dad", "Brice", "Meghan", "Christina", "Dane", "Sarah", "Mostafa"];
        cconst COLORS = ["#ff7675", "#74b9ff", "#55efc4", "#ffeaa7", "#a29bfe", "#fd79a8", "#fab1a0", "#81ecec"];

// HARDCODED MATCHES - Pre-calculated to guarantee your pairing rules
        const PRE_ASSIGNED_MATCHES = {
            "Mom": "Brice",
            "Brice": "Sarah",
            "Sarah": "Dad",
            "Dad": "Meghan",
            "Meghan": "Dane",
            "Dane": "Mostafa",
            "Mostafa": "Christina",
            "Christina": "Mom"};
        let isSpinning = false;
        let isFestive = false;
        let currentSegments = [];
        let currentAngle = 0;

        // Web Audio Setup
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Mechanical Wood Tick Effect
        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e){}
        }

        // Italian Acoustic Tarantella Music Engine
        let songTimer = null;
        let noteIndex = 0;

        // Dominick melody sequence in MIDI notes
        const TARANTELLA_MELODY = [
            // Verse - "Hey, Chingedy ching..."
            {n: 67, d: 0.22, b: 55}, {n: 67, d: 0.22, b: 0}, {n: 67, d: 0.22, b: 60}, {n: 69, d: 0.22, b: 0}, {n: 67, d: 0.44, b: 55},
            {n: 64, d: 0.22, b: 0}, {n: 64, d: 0.22, b: 60}, {n: 64, d: 0.44, b: 0},
            {n: 65, d: 0.22, b: 55}, {n: 65, d: 0.22, b: 0}, {n: 65, d: 0.22, b: 60}, {n: 67, d: 0.22, b: 0}, {n: 65, d: 0.44, b: 55},
            {n: 62, d: 0.22, b: 0}, {n: 62, d: 0.22, b: 60}, {n: 62, d: 0.44, b: 0},
            // Chorus - "La la la..."
            {n: 67, d: 0.22, b: 55}, {n: 72, d: 0.22, b: 0}, {n: 71, d: 0.22, b: 60}, {n: 69, d: 0.22, b: 0}, {n: 67, d: 0.44, b: 55},
            {n: 65, d: 0.22, b: 0}, {n: 64, d: 0.22, b: 60}, {n: 62, d: 0.44, b: 0}
        ];

        function midiToHz(m) {
            return 440 * Math.pow(2, (m - 69) / 12);
        }

        // Smooth Acoustic Instrument Voice
        function playAcousticNote(freq, duration, gainVal, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // Soft acoustic envelope
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(gainVal, audioCtx.currentTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Tambourine Jingle Simulation
        function playTambourine() {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = "highpass";
                filter.frequency.value = 5000;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }

        function playDominickStep() {
            if (!isFestive || !audioCtx) return;

            const note = TARANTELLA_MELODY[noteIndex];
            noteIndex = (noteIndex + 1) % TARANTELLA_MELODY.length;

            // Warm accordion lead (sine + warm triangle blend)
            playAcousticNote(midiToHz(note.n), note.d, 0.08, 'triangle');
            playAcousticNote(midiToHz(note.n + 4), note.d * 0.8, 0.03, 'sine'); // Harmonics

            // Acoustic Bass line
            if (note.b > 0) {
                playAcousticNote(midiToHz(note.b), note.d * 1.5, 0.09, 'sine');
            }

            // Rhythm Tambourine Accent
            if (noteIndex % 2 === 0) {
                playTambourine();
            }

            songTimer = setTimeout(playDominickStep, note.d * 1000);
        }

        function startMusic() {
            if (songTimer) clearTimeout(songTimer);
            noteIndex = 0;
            playDominickStep();
        }

        function stopMusic() {
            if (songTimer) clearTimeout(songTimer);
        }

        // Toggle Festive Button
        const festiveToggle = document.getElementById('festiveToggle');
        const festiveStatusText = document.getElementById('festiveStatusText');

        festiveToggle.addEventListener('click', () => {
            initAudio();
            isFestive = !isFestive;
            if (isFestive) {
                festiveToggle.classList.remove('off');
                festiveStatusText.innerText = "Are You Festive?: Yes";
                startMusic();
            } else {
                festiveToggle.classList.add('off');
                festiveStatusText.innerText = "Are You Festive?: No";
                stopMusic();
            }
        });

        // Canvas Rendering
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function drawWheel() {
            const numSegments = currentSegments.length;
            if (numSegments === 0) {
                ctx.clearRect(0, 0, 800, 800);
                ctx.fillStyle = "#2d3436";
                ctx.font = "bold 32px Fredoka";
                ctx.textAlign = "center";
                ctx.fillText("Select your name above!", 400, 400);
                return;
            }

            const arc = (Math.PI * 2) / numSegments;
            ctx.clearRect(0, 0, 800, 800);

            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.arc(400, 400, 380, angle, angle + arc);
                ctx.lineTo(400, 400);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Text
                ctx.save();
                ctx.translate(400, 400);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#2d3436";
                ctx.font = "bold 38px Fredoka";
                ctx.fillText(currentSegments[i], 340, 12);
                ctx.restore();
            }
        }

        // State Update Logic
        const userSelect = document.getElementById('userSelect');
        const spinBtn = document.getElementById('spinBtn');

        function updateAvailableTargets() {
        const currentUser = userSelect.value;
        if (!currentUser) return;

    // Fill the wheel with all other names to make the spin look real
    currentSegments = ALL_NAMES.filter(name => name !== currentUser);
    drawWheel();
    
    spinBtn.disabled = false;
    spinBtn.innerText = "SPIN THE WHEEL!";
}

            // Check if already spun
            if (userAssignments[currentUser]) {
                currentSegments = [userAssignments[currentUser]];
                drawWheel();
                spinBtn.disabled = true;
                spinBtn.innerText = "ALREADY SPUN!";
                return;
            }

            // Exclude already assigned targets and current user
            const assignedTargets = Object.values(userAssignments);
            currentSegments = ALL_NAMES.filter(name => name !== currentUser && !assignedTargets.includes(name));

            drawWheel();
            spinBtn.disabled = false;
            spinBtn.innerText = "SPIN THE WHEEL!";
        }

        userSelect.addEventListener('change', updateAvailableTargets);

        // Spin Engine
        spinBtn.addEventListener('click', () => {
            initAudio();
            const currentUser = userSelect.value;
            if (!currentUser || isSpinning || userAssignments[currentUser]) return;

            isSpinning = true;
            spinBtn.disabled = true;

            // FORCE the wheel to land on the pre-assigned target
            const chosenTarget = PRE_ASSIGNED_MATCHES[currentUser];
            const targetIndex = currentSegments.indexOf(chosenTarget);

            const numSegments = currentSegments.length;
            const arc = (Math.PI * 2) / numSegments;
            
            // Calculate final angle alignment to top pointer
            const targetSegmentAngle = targetIndex * arc + arc / 2;
            const totalRotations = 5 * Math.PI * 2;
            const finalAngle = totalRotations + (Math.PI * 1.5 - targetSegmentAngle);

            const startTime = performance.now();
            const duration = 4500;
            let lastTickSegment = -1;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);

                currentAngle = easeOut * finalAngle;
                drawWheel();

                // Check tick sound
                const currentSegmentAtPointer = Math.floor(((Math.PI * 1.5 - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / arc);
                if (currentSegmentAtPointer !== lastTickSegment) {
                    playTickSound();
                    document.getElementById('scissorsPointer').classList.add('tick');
                    setTimeout(() => document.getElementById('scissorsPointer').classList.remove('tick'), 50);
                    lastTickSegment = currentSegmentAtPointer;
                }

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
            

                    // Show Modal
                    document.getElementById('targetNameDisplay').innerText = chosenTarget;
                    document.getElementById('resultModal').classList.add('active');

                    // Confetti Explosion
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });

                    updateAvailableTargets();
                }
            }

            requestAnimationFrame(animateSpin);
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('resultModal').classList.remove('active');
        });

        // Share/Inspiration Generator
        document.getElementById('shareBtn').addEventListener('click', () => {
            const name = userSelect.value || "Family Member";
            const colors = document.getElementById('favColors').value || "Any colors!";
            const materials = document.getElementById('craftMaterials').value || "Surprise me!";
            const inspo = document.getElementById('inspiration').value || "Handmade with love!";

            const note = `🎄 Secret Santa Inspiration Note from ${name}! 🎄\n\n🎨 Colors/Aesthetic: ${colors}\n🧶 Preferred Materials: ${materials}\n💡 Inspiration & Ideas: ${inspo}\n\nCan't wait for our Crafty Christmas! ✨`;

            navigator.clipboard.writeText(note).then(() => {
                alert("Copied to clipboard! Paste it straight into the family group text! 📋✨");
            });
        });

        drawWheel();
    </script>
</body>
</html>
